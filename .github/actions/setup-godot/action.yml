name: Setup verified Godot 4.5.1
description: Cache the official Linux x86_64 archive and verify it on every use.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/city-venture/godot-4.5.1.zip
        key: godot-${{ runner.os }}-${{ runner.arch }}-4.5.1-02ec53d1cc7d
    - name: Install verified archive
      shell: bash
      run: |
        set -euo pipefail
        test "${{ runner.os }}" = "Linux"
        test "${{ runner.arch }}" = "X64"
        archive="$HOME/.cache/city-venture/godot-4.5.1.zip"
        mkdir -p "$(dirname "$archive")"
        if [ ! -f "$archive" ]; then
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o "$archive"
        fi
        echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $archive" | sha256sum --check --strict
        install_dir="$RUNNER_TEMP/city-venture-godot"
        mkdir -p "$install_dir"
        unzip -qo "$archive" -d "$install_dir"
        chmod +x "$install_dir/Godot_v4.5.1-stable_linux.x86_64"
        ln -sf "$install_dir/Godot_v4.5.1-stable_linux.x86_64" "$install_dir/godot"
        echo "$install_dir" >> "$GITHUB_PATH"
