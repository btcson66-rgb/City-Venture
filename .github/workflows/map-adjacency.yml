name: Map adjacency
on: [push, pull_request]
jobs:
  walking-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/qa/map_adjacency_check.py
      - run: python -m unittest discover -s tools/qa -p test_map_adjacency_check.py
