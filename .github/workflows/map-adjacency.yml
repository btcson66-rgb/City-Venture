name: Map adjacency
on:
  pull_request:
  push:
    branches: ['claude/exciting-bardeen-y71ixv']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-adjacency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  walking-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/qa/map_adjacency_check.py
      - run: python -m unittest discover -s tools/qa -p test_map_adjacency_check.py
