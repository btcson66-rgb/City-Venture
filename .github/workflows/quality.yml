name: Game quality

on:
  pull_request:
  push:
    branches: ['claude/exciting-bardeen-y71ixv']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Unit tests and evidence validator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-godot
      - name: Import project
        run: godot --headless --path game --import
      - name: Unit tests
        run: |
          mkdir -p /tmp/cv-quality
          godot --headless --path game res://tests/test_runner.tscn -- --junit=/tmp/cv-quality/unit.xml
      - name: Performance validator tests
        run: python -m unittest discover -s tools/qa -p test_perf_check.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          retention-days: 14
          path: /tmp/cv-quality
  acceptance:
    name: Translation, wiki, beta and performance gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - name: Install Python tooling
        run: python -m pip install -r .github/ci/requirements.txt
      - uses: ./.github/actions/setup-godot
      - name: Translation missing zero
        run: python tools/i18n_extract.py --check
      - name: Wiki coverage
        if: '!cancelled()'
        run: python tools/wiki_check.py
      - name: Character pose assembly
        if: '!cancelled()'
        run: python tools/qa/pose_check.py
      - name: Beta audit
        if: '!cancelled()'
        run: python tools/beta_audit.py
      - name: Import project
        if: '!cancelled()'
        run: godot --headless --path game --import
      - name: Short stress probe
        if: '!cancelled()'
        run: godot --headless --path game -- --bot=stress --days=3 --out=/tmp/cv-stress --wall_seconds=120
      - name: Performance budgets and coverage
        if: '!cancelled()'
        run: python tools/qa/perf_check.py /tmp/cv-stress/stress_result.json --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-report
          retention-days: 14
          path: /tmp/cv-stress/stress_result.json
