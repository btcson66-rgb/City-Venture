name: Web touch smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'game/**'
      - 'tools/qa/web_smoke.py'
      - '.github/workflows/web-smoke.yml'
      - '.github/ci/**'
      - '.github/actions/**'
  push:
    branches: ['claude/exciting-bardeen-y71ixv']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Export one verified Web build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - uses: actions/cache@v4
        id: web-templates
        with:
          path: ~/.local/share/godot/export_templates/4.5.1.stable
          key: godot-web-templates-${{ runner.os }}-${{ runner.arch }}-4.5.1-1998af37f138
      - name: Install verified Web templates
        if: steps.web-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -o "$RUNNER_TEMP/templates.tpz"
          echo "1998af37f1387684e2c211cdb483daf492fc64dc6b12096bddcdca25b6910c86  $RUNNER_TEMP/templates.tpz" | sha256sum --check --strict
          template_dir="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$template_dir"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/web*' -d "$template_dir"
          (cd "$template_dir" && sha256sum web* > template-files.sha256)
      - name: Verify cached template files
        run: |
          cd "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          sha256sum --check --strict template-files.sha256
      - name: Rebuild class cache and export actual Web build
        run: |
          set -euo pipefail
          godot --headless --path game --editor --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/import.log"
          mkdir -p build/web
          godot --headless --path game --export-release Web "$(pwd)/build/web/index.html" 2>&1 | tee "$RUNNER_TEMP/export.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/export.log"
          (cd build/web && find . -maxdepth 1 -type f ! -name build.sha256 -print0 | sort -z | xargs -0 sha256sum > build.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 1
  chromium-touch:
    name: Chromium mobile and tablet touch smoke
    needs: web-build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Pull requests run one representative combination; pushes to the integration branch and manual runs run all six.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"viewport":["portrait"],"size":["default"]}' || '{"viewport":["portrait","landscape","tablet"],"size":["default","large"]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/web-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - name: Verify shared Web build
        run: |
          cd build/web
          sha256sum --check --strict build.sha256
      - uses: actions/cache@v4
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci/web-requirements.txt') }}
      - name: Install Chromium
        run: |
          python -m pip install -r .github/ci/web-requirements.txt
          if [ "${{ steps.playwright-browsers.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Touch smoke in Traditional Chinese and English, normal and extra-large text
        run: python tools/qa/web_smoke.py --viewports ${{ matrix.viewport }} --sizes ${{ matrix.size }} --out qa-output/web-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-touch-smoke-${{ matrix.viewport }}-${{ matrix.size }}
          path: qa-output/web-smoke
          retention-days: 3
